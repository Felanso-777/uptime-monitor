<!DOCTYPE html>
<html>
<head>
    <title>Uptime Monitor</title>
</head>
<body>

<h2>🌐 Website Uptime Checker</h2>

<form method="POST">
    <input type="text" name="url" placeholder="Enter website URL" required>
    <button type="submit">Check</button>
</form>

{% if result %}
    <h3>Result:</h3>
    <p><b>Website:</b> {{ result.url }}</p>
    <p><b>Status:</b> {{ result.status }}</p>

    {% if result.code %}
        <p><b>Status Code:</b> {{ result.code }}</p>
        <p><b>Response Time:</b> {{ result.time }} ms</p>
    {% else %}
        <p><b>Error:</b> {{ result.error }}</p>
    {% endif %}
{% endif %}

</body>
</html>
